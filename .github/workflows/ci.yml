name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src
      - name: Syntax + import check
        working-directory: backend
        env:
          WATCHTOWER_SUBSCRIPTION_ID: '00000000-0000-0000-0000-000000000000'
          WATCHTOWER_RESOURCE_GROUP: 'ci-rg'
          WATCHTOWER_LOCATION: 'eastus'
          WATCHTOWER_FOUNDRY_ACCOUNT: 'ci-foundry'
          WATCHTOWER_APIM_SERVICE: 'ci-apim'
          WATCHTOWER_KEY_VAULT: 'ci-kv'
        run: python -c "from watchtower.main import app; print('OK', app.title)"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  infra:
    name: Infra (bicep build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Azure CLI + Bicep
        run: |
          az bicep install
          az bicep version
      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep
